services:
  qdrant:
    container_name: qdrant
    image: docker.io/qdrant/qdrant:v1.13.0
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - 6333:6333
    #   - 6334:6334
    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped

volumes:
  qdrant_data:
    external: true
